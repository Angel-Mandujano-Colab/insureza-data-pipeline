name: Pipeline Insureza Cloud

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        pip install pandas

    - name: Ejecutar Pipeline de Actualización Insureza
      run: python pipeline_insureza.py

    - name: Subir y sobrescribir Base Maestra en el repositorio
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "Auto-update Base Maestra Nacional (Insureza Bot)"
        file_pattern: insureza_base_maestra_nacional.csv
