name: Pipeline Insureza Cloud

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        pip install pandas

    - name: Ejecutar Pipeline de Actualización Insureza
      run: python pipeline_insureza.py

    - name: Guardar Base Maestra como Artifact en la Nube
      uses: actions/upload-artifact@v3
      with:
        name: insureza-base-maestra-nacional
        path: insureza_base_maestra_nacional.csv
