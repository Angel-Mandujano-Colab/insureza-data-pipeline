name: Actualización Diaria Base Maestra Insureza

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v3
      with:
        persist-credentials: true
        fetch-depth: 0

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        pip install pandas

    - name: Ejecutar Pipeline de Actualización Insureza
      run: python pipeline_insureza.py

    - name: Guardar y actualizar la Base Maestra en el repositorio
      run: |
        git config --global user.name 'Insureza Automation Bot'
        git config --global user.email 'bot@insureza.internal'
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        git fetch origin main
        git pull origin main --rebase --autostash || echo "No hay cambios previos que fusionar"
        git add insureza_base_maestra_nacional.csv
        git commit -m "Auto-update Base Maestra Nacional: $(date +'%Y-%m-%d %H:%M:%S')" || echo "No hay cambios nuevos"
        git push origin main
