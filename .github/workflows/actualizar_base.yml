name: Actualización Diaria Base Maestra Insureza

on:
  schedule:
    # Se ejecuta todos los días a las 12:00 UTC (6:00 AM Hora del Centro de México)
    - cron: '0 12 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un clic cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        pip install pandas

    - name: Ejecutar Pipeline de Actualización Insureza
      run: python pipeline_insureza.py

    - name: Guardar y actualizar la Base Maestra en el repositorio
      run: |
        git config --global user.name 'Insureza Automation Bot'
        git config --global user.email 'bot@insureza.internal'
        git add insureza_base_maestra_nacional.csv
        git commit -m "Auto-update Base Maestra Nacional: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
        git push
